<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tooltip Demonstration</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <h1>CSS Tooltip Demonstration</h1>

        <div class="tooltip-container">

            <div class="tooltip-box">
                Hover Me
                <span class="tooltip-text">This is a tooltip</span>
            </div>

            <div class="tooltip-box">
                More Info
                <span class="tooltip-text">Additional information</span>
            </div>

            <div class="tooltip-box">
                Submit
                <span class="tooltip-text">Click to submit</span>
            </div>

            <div class="tooltip-box">
                Settings
                <span class="tooltip-text">Open settings</span>
            </div>

        </div>

    </div>

</body>
</html>
