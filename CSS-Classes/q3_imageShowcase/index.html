<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Showcase</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <h1>Image Showcase</h1>

        <div class="gallery">

            <figure>
                <div class="image-box">
                    <img src="https://picsum.photos/id/1015/400/300" alt="Mountain">
                    <div class="overlay"></div>
                </div>
                <figcaption>Mountain View</figcaption>
            </figure>

            <figure>
                <div class="image-box">
                    <img src="https://picsum.photos/id/1016/400/300" alt="Nature">
                    <div class="overlay"></div>
                </div>
                <figcaption>Beautiful Nature</figcaption>
            </figure>

            <figure>
                <div class="image-box">
                    <img src="https://picsum.photos/id/1025/400/300" alt="Dog">
                    <div class="overlay"></div>
                </div>
                <figcaption>Lovely Dog</figcaption>
            </figure>

            <figure>
                <div class="image-box">
                    <img src="https://picsum.photos/id/1035/400/300" alt="River">
                    <div class="overlay"></div>
                </div>
                <figcaption>River View</figcaption>
            </figure>

            <figure>
                <div class="image-box">
                    <img src="https://picsum.photos/id/1043/400/300" alt="Forest">
                    <div class="overlay"></div>
                </div>
                <figcaption>Green Forest</figcaption>
            </figure>

            <figure>
                <div class="image-box">
                    <img src="https://picsum.photos/id/1050/400/300" alt="Beach">
                    <div class="overlay"></div>
                </div>
                <figcaption>Peaceful Beach</figcaption>
            </figure>

        </div>

    </div>

</body>
</html>
