
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Responsive Image Filter Gallery</title>

    <!-- External CSS file -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Header section -->
    <header>
        <h1>Image Filter Gallery</h1>
        <p>Responsive Gallery using CSS Filters</p>
    </header>

    <!-- Main content -->
    <main>

        <section class="gallery">

            <!-- Image 1 -->
            <figure>
                <img class="blur"
                     src="https://picsum.photos/id/1015/500/350"
                     alt="Mountain">
                <figcaption>Blur</figcaption>
            </figure>

            <!-- Image 2 -->
            <figure>
                <img class="grayscale"
                     src="https://picsum.photos/id/1016/500/350"
                     alt="Nature">
                <figcaption>Grayscale</figcaption>
            </figure>

            <!-- Image 3 -->
            <figure>
                <img class="sepia"
                     src="https://picsum.photos/id/1025/500/350"
                     alt="Dog">
                <figcaption>Sepia</figcaption>
            </figure>

            <!-- Image 4 -->
            <figure>
                <img class="brightness"
                     src="https://picsum.photos/id/1035/500/350"
                     alt="Landscape">
                <figcaption>Brightness</figcaption>
            </figure>

            <!-- Image 5 -->
            <figure>
                <img class="contrast"
                     src="https://picsum.photos/id/1043/500/350"
                     alt="Forest">
                <figcaption>Contrast</figcaption>
            </figure>

            <!-- Image 6 -->
            <figure>
                <img class="hue"
                     src="https://picsum.photos/id/1069/500/350"
                     alt="Nature">
                <figcaption>Hue Rotate</figcaption>
            </figure>

        </section>

    </main>

    <!-- Footer -->
    <footer>
        <p>CSS Filter Gallery</p>
    </footer>

</body>
</html>
