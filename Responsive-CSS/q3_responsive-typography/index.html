    <h1>Responsive Typography</h1>

<main>
    <section class="content">
        <h2>Responsive Text Design</h2>

        <p>
            Responsive typography allows text to adjust according
            to the screen size of the device.
        </p>

        <p>
            Using relative units such as rem and vw along with
            the clamp() function, text can remain readable on
            desktops, tablets and mobile devices.
        </p>

</main>
