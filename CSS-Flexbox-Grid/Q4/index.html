<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="dashboard">

        <!-- Header -->
        <header>
            <h1>Dashboard</h1>
        </header>

        <!-- Sidebar -->
        <aside>
            <h2>Menu</h2>
            <nav>
                <a href="#">Home</a>
                <a href="#">Profile</a>
                <a href="#">Settings</a>
                <a href="#">Logout</a>
            </nav>
        </aside>

        <!-- Main Content -->
        <main>

            <div class="box box1">
                <h2>Total Users</h2>
                <p>1,250</p>
            </div>

            <div class="box box2">
                <h2>Total Sales</h2>
                <p>₹75,000</p>
            </div>

            <div class="box box3">
                <h2>Projects</h2>
                <p>24 Active Projects</p>
            </div>

            <div class="box box4">
                <h2>Recent Activity</h2>
                <p>5 New activities today.</p>
            </div>

        </main>

    </div>

</body>
</html>
