<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Student Report Page</title>
</head>
<body>
    <h1>Springfield High School</h1>
    <h2>Student Academic Report Card</h2>
    <table border="1">
        <thead>
            <tr>
                <th title="Subject Name">Subject</th>
                <th title="Maximum Marks">Max Marks</th>
                <th title="Marks Obtained">Marks Obtained</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Mathematics</td>
                <td>100</td>
                <td>85</td>
            </tr>
            <tr>
                <td>English</td>
                <td>100</td>
                <td>78</td>
            </tr>
            <tr>
                <td>Science</td>
                <td>100</td>
                <td>92</td>
            </tr>
            <tr>
                <td>Social Studies</td>
                <td>100</td>
                <td>88</td>
            </tr>
            <tr>
                <td>Computer Science</td>
                <td>100</td>
                <td>95</td>
            </tr>
        </tbody>
        <tfoot>
            <tr>
                <td colspan="2" title="Total Marks Obtained / Maximum Marks"><strong>Total / Percentage</strong></td>
                <td><strong>438 / 87.6%</strong></td>
            </tr>
        </tfoot>
    </table>
</body>
</html>
