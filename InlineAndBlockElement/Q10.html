<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dropdown-based Selection Page</title>
</head>
<body>
    <h1>Travel Destination Selector</h1>
    <form>
        <label for="country">Country:</label>
        <select id="country" name="country">
            <option value="india" selected>India</option>
            <option value="france">France</option>
            <option value="japan">Japan</option>
        </select>
        <br><br>

        <label for="state">State:</label>
        <select id="state" name="state">
            <option value="uttar-pradesh" selected>Uttar Pradesh</option>
            <option value="kerala">Kerala</option>
            <option value="goa">Goa</option>
        </select>
        <br><br>

        <label for="city">City:</label>
        <select id="city" name="city">
            <option value="agra" selected>Agra</option>
            <option value="varanasi">Varanasi</option>
            <option value="lucknow">Lucknow</option>
        </select>
        <br><br>

        <label for="place">Favorite Tourist Place:</label>
        <select id="place" name="place">
            <option value="taj-mahal" selected>Taj Mahal</option>
            <option value="ganga-ghat">Ganga Ghat</option>
            <option value="imambara">Bara Imambara</option>
        </select>
    </form>

    <p>Your selected choices: Country - India, State - Uttar Pradesh, City - Agra, Favorite Tourist Place - Taj Mahal.</p>
</body>
</html>
