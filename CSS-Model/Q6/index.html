<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Transformations Showcase</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Page Header -->
    <header>
        <h1>CSS Transformations Showcase</h1>
        <p>Demonstrating rotate, scale, translate, and skew with smooth hover transitions.</p>
    </header>

    <!-- Main Content Area -->
    <main>
        <section class="transform-container">
            <!-- Box 1: Rotate Transformation -->
            <div class="transform-item">
                <div class="box rotate-box">Rotate</div>
                <p class="label">rotate(45deg)</p>
            </div>

            <!-- Box 2: Scale Transformation -->
            <div class="transform-item">
                <div class="box scale-box">Scale</div>
                <p class="label">scale(1.2)</p>
            </div>

            <!-- Box 3: Translate Transformation -->
            <div class="transform-item">
                <div class="box translate-box">Translate</div>
                <p class="label">translate(0, -15px)</p>
            </div>

            <!-- Box 4: Skew Transformation -->
            <div class="transform-item">
                <div class="box skew-box">Skew</div>
                <p class="label">skew(15deg, 10deg)</p>
            </div>
        </section>
    </main>

    <!-- Page Footer -->
    <footer>
        <p>&copy; 2026 Web Development Lab. All rights reserved.</p>
    </footer>
</body>
</html>
